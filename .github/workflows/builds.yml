# The CYD and TTGO VGA32 (ESP-IDF 5.3) and web (Emscripten) builds of every driver, with no
# ROMs built in (they are read from the microSD / from the page's server).
# Runs on a push to the ci-builds branch or by hand; the binaries are the
# run's artifacts (cyd-<game>, vga32-<game>, web).
name: builds

on:
  push:
    branches: [ci-builds]
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      cyd: ${{ steps.games.outputs.cyd }}
      vga32: ${{ steps.games.outputs.vga32 }}
    steps:
      - uses: actions/checkout@v4
      - id: games
        run: |
          consoles=$(sed -n 's/^CONSOLES := //p' main/drivers/consoles/consoles.mk)
          games=$(sed -n 's/^for g in \(.*\) \$CONSOLES; do$/\1/p' build_all.sh)
          echo "cyd=$(printf '%s\n' $games $consoles | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          big=$(sed -n 's/^ARC_BIG := //p' main/drivers/arcades/arcades.mk)
          arcades=$(sed -n 's/^ARCADES := //p' main/drivers/arcades/arcades.mk | tr ' ' '\n' | grep -vxF $(printf -- '-e %s ' $big) | tr '\n' ' ')
          echo "vga32=$(printf '%s\n' $games $arcades $consoles | sort -u | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  cyd:
    needs: list
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJson(needs.list.outputs.cyd) }}
    steps:
      - uses: actions/checkout@v4
      - name: build ${{ matrix.game }} (LCD SPI 40 and 80 MHz)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          g=${{ matrix.game }}
          mkdir -p dist
          for mhz in 40 80; do
            b=build/$g-noroms-$mhz
            LCD_SPI_MHZ=$mhz idf.py -B $b -DGAME=$g -DROMS=external build
            (cd $b && esptool.py --chip esp32 merge_bin -o ../../dist/${g}_cyd_st7789_spi${mhz}mhz_noroms_full.bin @flash_args)
            cp $b/${g}_cyd.bin dist/${g}_cyd_st7789_spi${mhz}mhz_noroms_app_0x10000.bin
            rm -f sdkconfig
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cyd-${{ matrix.game }}
          path: dist/*.bin

  vga32:
    needs: list
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJson(needs.list.outputs.vga32) }}
    steps:
      - uses: actions/checkout@v4
      - name: build ${{ matrix.game }} for the TTGO VGA32
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          ROMS=external ./build_vga32.sh ${{ matrix.game }}
      - uses: actions/upload-artifact@v4
        with:
          name: vga32-${{ matrix.game }}
          path: dist/*.bin

  web:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.74
    steps:
      - uses: actions/checkout@v4
      - name: build every driver
        shell: bash
        run: |
          games=$(sed -n '/^GAMES   := /,/[^\\]$/p' main/ports/web/Makefile | sed 's/^GAMES   := //; s/\\//; s/\$(CONSOLES)//; s/\$(ARCADES)//')
          games="$games $(sed -n 's/^CONSOLES := //p' main/drivers/consoles/consoles.mk)"
          games="$games $(sed -n 's/^ARCADES := //p' main/drivers/arcades/arcades.mk)"
          failed=""
          for g in $games; do
            make -C main/ports/web GAME=$g ROMS=external || failed="$failed $g"
          done
          cp main/ports/web/index.html build/web-noroms/index.html
          if [ -n "$failed" ]; then echo "FAILED:$failed"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web
          path: build/web-noroms
