# Temporary: the Atari ST web build (no ROMs) printed into the log (base64).
name: st-web-dump
on:
  push:
    branches: [st-web-dump]
jobs:
  web:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.74
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          make -C main/ports/web GAME=atarist ROMS=external > /dev/null
          ls -la build/web-noroms
          tar -C build/web-noroms -cJf /tmp/out.tar.xz .
          sha256sum /tmp/out.tar.xz
          echo "BEGIN-B64"; base64 -w 1000 /tmp/out.tar.xz | sed 's/^/B64:/'; echo "END-B64"
